# Skill catalog: a map of every skill in this folder, for any AI agent
# (Claude, Codex, opencode, Antigravity, Gemini CLI, Cursor, others).
#
# Format: each skill is a folder with SKILL.md. SKILL.md starts with a YAML header
# (name, description), the Agent Skills open standard that Claude and Codex both read.
# Some skills also have references/, scripts/, agents/ or assets/ folders.
#
# How an agent should use this file:
#   1. Read only this index at the start. Don't open every SKILL.md.
#   2. When a task matches a skill's use_when, read that SKILL.md, then only the
#      reference files it points to.
#   3. Skills listed in depends_on are loaded only when that step comes up.
#
# visibility:
#   shareable = safe to give to anyone
#   company   = your company / Your Studio team only (company process, product examples)
#   private   = owner only (confidential figures, deal terms, personal voice). Never share.
# workers: true = installed into ~/.agents/skills for Codex and opencode by scripts/install-rules.sh

schema: 1
updated: 2026-10-28
owner: you
source: shared starter skills; add your own with shortcuts/12 Add My Skills.bat

skills:
  # --- Coding ---
  - name: ponytail
    path: ponytail/SKILL.md
    category: coding
    use_when: Any coding task (build, fix, refactor). Smallest complete change, reuse before writing, never cut validation.
    visibility: shareable
    workers: true
    license: MIT, adapted from github.com/dietrichgebert/ponytail
    depends_on: []

  - name: ponytail-review
    path: ponytail-review/SKILL.md
    category: coding
    use_when: Review a change, audit a repo, or list shortcut debt. Report only, changes nothing.
    visibility: shareable
    workers: true
    license: MIT, adapted from github.com/dietrichgebert/ponytail
    depends_on: []

